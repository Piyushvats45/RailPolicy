services:
  - type: web
    name: irctc-policy-assistant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # set this manually in the Render dashboard (get a free key at console.groq.com)
      - key: FRONTEND_URL
        sync: false   # set this to your deployed Vercel URL, e.g. https://your-app.vercel.app
